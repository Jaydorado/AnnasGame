<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solitaire Dreams — art gallery (dev only)</title>
    <style>
      body.wood { min-height: 100vh; }
      body.wood::before, body.wood::after { display: none; }
      [hidden] { display: none !important; }
      main { padding: 8px 12px 16px; }
      h2 { margin: 10px 0 6px; font-size: 13px; color: #fff8ef; text-shadow: 0 1px 2px rgba(60, 20, 2, 0.6); }
      .grid { display: flex; flex-wrap: wrap; gap: 6px; }
      .cell { width: var(--w); }
      .grid .cell svg { display: block; width: 100%; height: auto; border-radius: var(--card-r); box-shadow: var(--card-shadow); }
      .grid[style*="48px"] .cell svg { border-radius: 0; box-shadow: none; }
      .row { display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
      .peak { position: relative; }
      .strips { display: flex; gap: 28px; padding: 12px 0 0 12px; }
      .prop-cell { display: block; width: 150px; height: 90px; }
      .prop-cell svg { width: 100%; height: 100%; }
    </style>
  </head>
  <body class="wood">
    <main id="gallery"></main>
    <script type="module" src="/src/ui/art/gallery.ts"></script>
  </body>
</html>
